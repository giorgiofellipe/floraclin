name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# Each check runs as its own job so they run in parallel; CI takes as long as
# the slowest one instead of the sum. Web tests are split into shards.
jobs:
  check:
    name: ${{ matrix.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Lint
            run: pnpm --filter @floraclin/web lint
          - name: Typecheck
            run: pnpm --filter @floraclin/web typecheck
          - name: Tests (1/3)
            run: pnpm --filter @floraclin/web test:run --shard=1/3
          - name: Tests (2/3)
            run: pnpm --filter @floraclin/web test:run --shard=2/3
          - name: Tests (3/3)
            run: pnpm --filter @floraclin/web test:run --shard=3/3
          - name: Site tests
            run: pnpm --filter @floraclin/site test:run

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure private dependencies
        run: bash scripts/configure-private-deps.sh
        env:
          FISCAL_REPO_TOKEN: ${{ secrets.FISCAL_REPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: ${{ matrix.name }}
        run: ${{ matrix.run }}

  # Keeps the old job name as the single status to require on PRs.
  ci:
    name: lint · typecheck · test
    if: always()
    needs: check
    runs-on: ubuntu-latest
    steps:
      - name: All checks passed
        if: needs.check.result != 'success'
        run: exit 1

  db:
    name: database tests
    runs-on: ubuntu-latest
    timeout-minutes: 10

    # A throwaway Postgres: these tests write, lock and race real rows.
    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: floraclin_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d floraclin_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      DATABASE_URL: postgresql://test:test@localhost:5432/floraclin_test
      RUN_DB_TESTS: '1'

    steps:
      - uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Configure private dependencies
        run: bash scripts/configure-private-deps.sh
        env:
          FISCAL_REPO_TOKEN: ${{ secrets.FISCAL_REPO_TOKEN }}

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Migrate
        working-directory: web
        run: node scripts/setup-test-db.mjs

      - name: Tests
        working-directory: web
        run: pnpm exec vitest run --no-file-parallelism src/db/queries/__tests__/financial-accounts-db.test.ts src/db/queries/__tests__/bank-reconciliation-db.test.ts

      - name: Database tests on a BR host
        working-directory: web
        env:
          TZ: America/Sao_Paulo
          DATABASE_URL: postgresql://test:test@localhost:5432/floraclin_test_br
        run: |
          node --input-type=module <<'JS'
          import postgres from 'postgres'
          const admin = postgres('postgresql://test:test@localhost:5432/postgres', { max: 1 })
          try { await admin.unsafe('CREATE DATABASE floraclin_test_br') }
          finally { await admin.end() }
          JS
          node scripts/setup-test-db.mjs
          pnpm exec vitest run --no-file-parallelism src/db/queries/__tests__/bank-reconciliation-db.test.ts
